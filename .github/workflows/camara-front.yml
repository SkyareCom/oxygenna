name: OXYGENNA — regressão do front com CÂMARA
on:
  push:
    paths:
      - "dist/**"
      - "tests/camara-front.test.mjs"
      - "tests/camara-depth.test.mjs"
      - ".github/workflows/camara-front.yml"
  pull_request:
    paths:
      - "dist/**"
      - "tests/camara-front.test.mjs"
      - "tests/camara-depth.test.mjs"
      - ".github/workflows/camara-front.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
