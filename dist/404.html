<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OXYGENNA — Abrindo consulta</title><meta name="robots" content="noindex"></head>
<body style="background:#031721;color:#f0f5f3;font:400 14px 'Saira Semi Condensed',sans-serif;margin:0;padding:20px">
<p>ABRINDO OXYGENNA…</p>
<script>
(function(){
 var base=location.pathname.indexOf('/oxygenna/')===0?'/oxygenna/':'/';
 var path=location.pathname.slice(base.length).replace(/^\/+/, '');
 if(!/^(home|fisiologia|clinica|camara|operacao|capitulo\/[a-z0-9-]+)$/.test(path)){path='home';}
 var destination=base+'?route='+encodeURIComponent('/'+path);
 location.replace(destination);
})();
</script>

</body></html>
